name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bash -n scripts/d1-backup.sh scripts/verify-d1-backup.sh scripts/deploy-smoke-test.sh
      - run: python3 scripts/test-export-d1-csv.py
      - run: bun audit --audit-level=high
      - name: Validate generated database migrations
        run: |
          bun run db:generate
          git diff --exit-code -- packages/db/src/migrations
      - run: bun test
      - run: bun run check-types
      - run: bun run lint
      - run: bun run build
      - run: bun run check:bundle
      - run: bun run check:seo
      - run: bun run check:routes
      - run: bun run check:ssr
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: node node_modules/.bin/playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
