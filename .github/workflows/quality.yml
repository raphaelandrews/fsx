name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:runtime
      - run: bash -n scripts/d1-backup.sh scripts/verify-d1-backup.sh scripts/deploy-smoke-test.sh
      - run: python3 scripts/test-export-d1-csv.py
      # braces (GHSA-vfj7-8cjw-p6xm) has no fixed release; it only reaches the shadcn CLI, never the Worker or the browser.
      # zod 3.x (GHSA-mrhx-c7xc-m3w5, shadcn CLI only) has no fixed 3.x release; launch-editor (GHSA-587h-7wmj-h5pm) is a Windows-only dev-server issue via vite-plus, which is pinned by check:runtime.
      - run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-mrhx-c7xc-m3w5 --ignore GHSA-587h-7wmj-h5pm
      - name: Validate generated database migrations
        run: |
          bun run db:generate
          test -z "$(git status --porcelain -- packages/db/src/migrations)"
      - run: bun test
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run check:bundle
      - run: bun run check:seo
      - run: bun run check:routes
      - run: bun run check:ssr
      - id: playwright
        working-directory: apps/web
        run: echo "version=$(node node_modules/.bin/playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: node node_modules/.bin/playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
