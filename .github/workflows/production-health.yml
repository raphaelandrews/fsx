name: Production health

# Fails (and GitHub notifies the repository owner) when the last hour shows an
# elevated 5xx rate, a rate-limit spike, or Worker exceptions.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account Analytics:Read + Zone Analytics:Read), CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-production-health.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
